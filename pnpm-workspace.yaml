packages:
  - packages/*
  - examples/*
  # The `create` template. A workspace member so the repo typechecks, lints
  # and tests it — a template that is not live code is a template that rots.
  - packages/cli/template

# Supply chain. The runtime has zero dependencies (SPEC A4); these settings
# guard the dev toolchain and CI, which is where an attack would land.

# Refuse versions published less than 3 days ago. Hijacked releases are
# usually detected and unpublished within hours.
minimumReleaseAge: 4320

# Fail when a package's publish trust drops (e.g. provenance → none), the
# usual signature of a stolen token.
trustPolicy: no-downgrade

# Transitive dependencies may not come from git or tarball URLs.
blockExoticSubdeps: true

# No dependency lifecycle script runs unless listed here as true.
strictDepBuilds: true
# esbuild's postinstall only re-verifies the platform binary it already gets
# through optionalDependencies, so it stays blocked.
allowBuilds:
  esbuild: false

engineStrict: true

# Advisory floors for transitive dev dependencies, scoped to the vulnerable
# range so an unaffected major is never forced. Drop an entry once every
# parent resolves past it unaided.
overrides:
  # GHSA-q2hr-2g5m-vwhr and two DoS advisories; reached only through
  # eslint-plugin-jsdoc → minimatch.
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
