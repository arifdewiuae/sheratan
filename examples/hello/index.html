<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SHERATAN — live metrics</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23FAFAF8'/%3E%3Cg fill='%23000'%3E%3Crect x='2' y='12' width='1' height='1'/%3E%3Crect x='7' y='8' width='1' height='1'/%3E%3Crect x='6' y='9' width='3' height='1'/%3E%3Crect x='7' y='10' width='1' height='1'/%3E%3Crect x='12' y='3' width='2' height='2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="A live dashboard built with sheratan: 500 rows, 20 000 values a second, at 60 frames a second — and the four-file module shape every feature takes."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap"
    />
    <!-- Tokens and base, then one scoped sheet per module (SPEC §9a). With no
         bundler there is nothing to collect them, so a module's stylesheet is
         linked the same way its module is imported: once, by name. -->
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/modules/dashboard/dashboard.css" />
    <link rel="stylesheet" href="/modules/orders/orders.css" />
    <!-- One import map, no bundler. `?build=prod` swaps in the production build. -->
    <script type="importmap">
      { "imports": { "sheratan": "/sheratan/dev/index.js" } }
    </script>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
