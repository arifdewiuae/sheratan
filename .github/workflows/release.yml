# Publishes `sheratan` to npm with no token anywhere.
#
# Authentication is npm trusted publishing (OIDC): the `id-token: write`
# permission below lets pnpm exchange a short-lived GitHub identity token for a
# publish credential that expires in minutes. Provenance is generated and
# attached automatically as a side effect — the `--provenance` flag is not
# needed and is deliberately absent.
#
# npm matches its trusted-publisher configuration on repository and workflow
# filename, so renaming this file breaks publishing until the configuration on
# npmjs.com is updated to match. The environment field there is deliberately
# left blank; if it is ever filled in, this job needs a matching `environment:`
# or the OIDC exchange fails.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The whole point: a short-lived OIDC token instead of a stored secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Ancestry against main is checked below, which needs real history.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # A tag that disagrees with the manifest publishes a version nobody asked
      # for, under a tag that points at different code. Fail before the build.
      - name: Tag matches the manifest version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(node -p "require('./packages/core/package.json').version")"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tagged, package.json says $packaged"
            exit 1
          fi
          echo "publishing sheratan@$packaged"

      # Pushing the tag is now the only human decision in a release, so it has
      # to be the right commit: AGENTS.md says releases are tagged on `main`,
      # and a tag on a feature branch would otherwise publish from it.
      - name: Tag is on main
        run: |
          # FETCH_HEAD, not origin/main: checkout narrows the refspec, so the
          # remote-tracking ref is not guaranteed to exist. Anonymous fetch is
          # fine while the repo is public, which is why no token is needed.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main; releases are tagged on main"
            exit 1
          fi

      # Everything CI runs, in CI order. A release is not the place to find out
      # the tree is red.
      - name: Check
        run: pnpm check

      # No NODE_AUTH_TOKEN, no NPM_TOKEN, no .npmrc credentials. pnpm performs
      # the OIDC exchange itself when it sees the Actions token in the
      # environment.
      - name: Publish
        run: pnpm --filter sheratan publish --access public --no-git-checks
